name: Sync sticker manifest

on:
  push:
    branches:
      - main
      - master
    paths:
      - "data/**"
      - "scripts/*.py"
      - ".github/workflows/sync-stickers.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image tools
        run: python -m pip install --quiet Pillow

      - name: Generate previews
        run: python scripts/make_previews.py

      - name: Generate manifest
        # 预埋：把图片切到对象存储 / CDN 时，只需在仓库
        # Settings → Secrets and variables → Actions → Variables 里加这几个变量，
        # 不必改任何代码（这些是明文变量，不放密钥；密钥永远不进仓库）。
        #   GALLERY_BASE_URL         例如 https://img.example.com/
        #   GALLERY_PREVIEW_BASE_URL 可选，只给缩略图用
        #   GALLERY_LARGE_BASE_URL   可选，只给灯箱大图用
        #   GALLERY_STORAGE_MODE     local（默认）| remote
        env:
          GALLERY_STORAGE_MODE: ${{ vars.GALLERY_STORAGE_MODE }}
          GALLERY_BASE_URL: ${{ vars.GALLERY_BASE_URL }}
          GALLERY_PREVIEW_BASE_URL: ${{ vars.GALLERY_PREVIEW_BASE_URL }}
          GALLERY_LARGE_BASE_URL: ${{ vars.GALLERY_LARGE_BASE_URL }}
        run: python scripts/sync_stickers.py

      - name: Commit updated manifest and previews
        run: |
          MANIFESTS="$(git ls-files --modified --others --exclude-standard stickers || true)"
          NEW_FILES="$(git ls-files --others --exclude-standard previews large)"
          if git diff --quiet -- stickers previews large && [ -z "$NEW_FILES" ]; then
            echo "Manifest and previews are already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stickers previews large
          git commit -m "chore: sync sticker manifest and previews"
          git push
