name: Validate sticker manifest

on:
  pull_request:
    paths:
      - "data/**"
      - "stickers/*.json"
      - "scripts/*.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image tools
        run: python -m pip install --quiet Pillow

      - name: Generate previews
        run: python scripts/make_previews.py

      - name: Validate partition manifests
        run: python scripts/sync_stickers.py --check

      - name: Check manifest entries point to existing files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifests = sorted(Path("stickers").glob("manifest_*.json"))
          if not manifests:
              raise SystemExit("no partition manifest found")

          # 冲突检查比的是"生成产物路径"（previews/、large/ 下的文件），
          # 不是原始文件名：不同主题常有同名原图（各有一个 01.jpg），
          # 产物名带 <主题>-<分区>- 前缀，所以同名原图本来就不冲突。
          outputs = {}
          errors = []
          for path in manifests:
              payload = json.loads(path.read_text(encoding="utf-8"))
              # 兼容两种清单格式：新的 { storage, items } 与旧的裸数组
              entries = payload if isinstance(payload, list) else payload.get("items", [])
              storage = {} if isinstance(payload, list) else payload.get("storage", {})
              print(f"{path.as_posix()}: {len(entries)} entries"
                    + (f"  storage={storage.get('mode', '?')} baseUrl={storage.get('baseUrl', '') or '(相对路径)'}"
                       if storage else "  (旧格式)"))
              for entry in entries:
                  for key in ("original", "preview", "large"):
                      rel = entry.get(key)
                      if not rel:
                          continue
                      target = Path(rel)
                      if not target.is_file():
                          errors.append(f"{path.name}: {key} missing -> {rel}")
                          continue
                      if key in ("preview", "large"):
                          owner = outputs.setdefault(rel, path.name)
                          if owner != path.name:
                              errors.append(
                                  f"{path.name}: generated file '{rel}' already claimed by {owner}"
                              )
          if errors:
              raise SystemExit("\n".join(errors))
          print("All manifest entries reference existing files, no stem collisions.")
          PY
